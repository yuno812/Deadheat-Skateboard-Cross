[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dsc-core = { path = "crates/dsc-core" }
dsc-scenario = { path = "crates/dsc-scenario" }
dsc-ai = { path = "crates/dsc-ai" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
# DLLの境界でcatch_unwindするため、panicはunwindのままにする
panic = "unwind"
debug = "line-tables-only"
